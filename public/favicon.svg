<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Tile Base Gradient -->
    <linearGradient id="bgTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Ocean Blue to Vibrant Aqua -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Route and Accent: Cyan to Orange -->
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgTile)"/>

  <!-- Earth Globe Body -->
  <circle cx="32" cy="26" r="18" fill="url(#oceanGrad)"/>
  
  <!-- Stylized Green Landmasses -->
  <path d="M22 19 C26 15 35 14 41 18 C41 22 36 24 33 23 C30 22 28 26 25 26 C22 26 20 22 22 19 Z" fill="#34D399"/>
  <path d="M26 30 C29 28 34 30 36 33 C37 37 34 41 31 42 C28 42 25 38 25 35 Z" fill="#34D399"/>

  <!-- Orbiting Route forming 'Z' across the globe -->
  <path d="M18 18 H42 L18 35 H42" 
        fill="none" 
        stroke="url(#routeGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Waypoint Dot at Destination -->
  <circle cx="42" cy="18" r="2.5" fill="#F97316"/>
  <circle cx="42" cy="18" r="1" fill="#FFFFFF"/>

  <!-- Brand Text: ZARAVIA -->
  <text x="32" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="1.2" fill="#FFFFFF">ZARAVIA</text>
</svg>
